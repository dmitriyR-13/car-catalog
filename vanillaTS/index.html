<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Auto catalog</title>
</head>

<body>
    <main id="main">
        <header class="main-header">
            <h1 id="mainTitle">Auto Catalog</h1>
        </header>
        <section id="controls">
            <div>
                <label for="searchCar" class="visually-hidden">Поиск автомобиля</label>
                <input id="searchCar" placeholder="Поиск автомобиля">
            </div>
            <div>
                <label for="sortCars" class="visually-hidden">Сортировка</label>
                <select id="sortCars">
                    <option value="default">по умолчанию</option>
                    <option value="priceAsc">цена ↑</option>
                    <option value="priceDesc">цена ↓</option>
                    <option value="yearAsc">год ↑</option>
                    <option value="yearDesc">год ↓</option>
                </select>
            </div>
            <div>
                <button id="addCarBtn">Добавить авто</button>
                <dialog id="addCarDialog">
                    <form id="addCarForm">
                        <label for="brandInput" class="visually-hidden">Бренд автомобиля</label>
                        <input type="text" name="brand" id="brandInput" placeholder="Бренд" required>
                        <label for="modelInput" class="visually-hidden">Модель автомобиля</label>
                        <input type="text" name="model" id="modelInput" placeholder="Модель" required>
                        <label for="yearInput" class="visually-hidden">Год выпуска</label>
                        <input type="number" name="year" id="yearInput" min="1900" max="2026" placeholder="Год"
                            required>
                        <label for="engineInput" class="visually-hidden">Объем двигателя</label>
                        <input type="number" step="0.1" name="engine" id="engineInput" min="0.1" placeholder="Объем"
                            required>
                        <label for="powerInput" class="visually-hidden">Мощность двигателя</label>
                        <input type="number" name="power" id="powerInput" min="1" placeholder="Мощность" required>
                        <label for="priceInput" class="visually-hidden">Цена автомобиля</label>
                        <input type="number" name="price" id="priceInput" min="1" placeholder="Цена" required>
                        <p id="formError"></p>
                        <button type="submit">Добавить</button>
                        <button type="button" id="cancelAddBtn">Отмена</button>
                    </form>
                </dialog>
            </div>
        </section>
        <p id="catalogStatus"></p>
        <section id="catalog"></section>
        <dialog id="carDialog">
            <h2 id="dialogTitle"></h2>
            <div id="dialogInfo"></div>
            <button id="closeBtn">Закрыть</button>
        </dialog>
    </main>
    <script type="module" src="/src/js/main.ts"></script>
</body>

</html>
